<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importaciones — Facturas</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: #f5f4f0; display: flex; flex-direction: column; height: 100vh; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #fff; border-bottom: 1px solid #ebebeb; flex-shrink: 0; }
        .topbar-title { font-size: 14px; font-weight: 600; color: #1a1a1a; }
        .topbar-user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #888; }
        .avatar { width: 30px; height: 30px; border-radius: 50%; background: #f0f0f0; border: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: center; }
        .layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 200px; background: #fff; border-right: 1px solid #ebebeb; padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; font-size: 13px; color: #666; cursor: pointer; text-decoration: none; transition: background 0.15s; }
        .nav-item:hover { background: #f5f4f0; color: #1a1a1a; }
        .nav-item.active { background: #f0efeb; color: #1a1a1a; font-weight: 500; }
        .nav-item i { font-size: 16px; }
        .main { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .page-header { display: flex; align-items: center; justify-content: space-between; }
        .page-header h1 { font-size: 18px; font-weight: 600; color: #1a1a1a; }
        .page-header p { font-size: 13px; color: #888; margin-top: 2px; }
        .table-card { background: #fff; border-radius: 14px; border: 1px solid #ebebeb; overflow: hidden; }
        .table-toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid #f0f0f0; }
        .search-input { flex: 1; padding: 8px 12px; border: 1px solid #e8e8e8; border-radius: 8px; font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; background: #fafafa; }
        .search-input:focus { border-color: #1a1a1a; background: #fff; }
        select.filter-select { padding: 8px 12px; border: 1px solid #e8e8e8; border-radius: 8px; font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; background: #fafafa; color: #1a1a1a; }
        table { width: 100%; border-collapse: collapse; }
        thead th { padding: 10px 18px; text-align: left; font-size: 11px; font-weight: 500; color: #999; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #f0f0f0; }
        tbody tr { border-bottom: 1px solid #f8f8f8; transition: background 0.1s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #fafafa; }
        tbody td { padding: 12px 18px; font-size: 13px; color: #333; }
        .td-main { font-weight: 500; color: #1a1a1a; }
        .td-sub { font-size: 11px; color: #999; margin-top: 1px; }
        .btn-primary { display: flex; align-items: center; gap: 6px; padding: 9px 16px; background: #1a1a1a; color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; }
        .btn-primary:hover { background: #333; }
        .btn-sm { padding: 5px 10px; background: #1a1a1a; color: #fff; border: none; border-radius: 7px; font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
        .btn-sm:hover { background: #333; }
        .empty-state { text-align: center; padding: 48px; color: #aaa; font-size: 14px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(0,0,0,0.12); }
        .modal h2 { font-size: 17px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
        .modal-sub { font-size: 13px; color: #888; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { font-size: 12px; font-weight: 500; color: #555; }
        .form-group input, .form-group select, .form-group textarea { padding: 9px 12px; border: 1px solid #e8e8e8; border-radius: 8px; font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; background: #fafafa; color: #1a1a1a; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #1a1a1a; background: #fff; }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-secondary { padding: 9px 16px; background: #fff; color: #333; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
        .btn-secondary:hover { background: #f5f4f0; }
    </style>
</head>
<body>
    <div class="topbar">
        <span class="topbar-title">Sistema de Importaciones</span>
        <div class="topbar-user">
            <span>Usuario 3 — Facturas</span>
            <div class="avatar"><i class="ti ti-user" style="font-size:14px;color:#888;"></i></div>
        </div>
    </div>
    <div class="layout">
        <div class="sidebar">
            <a class="nav-item" href="pedidos.html"><i class="ti ti-package"></i> Importaciones</a>
            <a class="nav-item" href="/seguimiento"><i class="ti ti-truck"></i> Seguimiento</a>
            <a class="nav-item active" href="/facturas-page"><i class="ti ti-file-invoice"></i> Facturas</a>
            <a class="nav-item" href="/pagos-page"><i class="ti ti-credit-card"></i> Pagos</a>
            <a class="nav-item" href="/proveedores-page"><i class="ti ti-building"></i> Proveedores</a>
        </div>
        <div class="main">
            <div class="page-header">
                <div>
                    <h1>Facturas</h1>
                    <p id="subtitulo">Cargando...</p>
                </div>
                <button class="btn-primary" onclick="abrirModal()">
                    <i class="ti ti-plus"></i> Nueva factura
                </button>
            </div>
            <div class="table-card">
                <div class="table-toolbar">
                    <input class="search-input" type="text" placeholder="Buscar por N° factura o proveedor..." oninput="filtrar(this.value)">
                    <select class="filter-select" id="filtro-importacion" onchange="filtrarPorImportacion()">
                        <option value="">Todas las importaciones</option>
                    </select>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>N° Factura</th>
                            <th>Importación</th>
                            <th>Proveedor</th>
                            <th>N° Tracking</th>
                            <th>Proveedor factura</th>
                            <th>Fecha</th>
                            <th>Monto</th>
                            <th>Descripción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                        <tr><td colspan="6" class="empty-state">Cargando facturas...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVA FACTURA -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2>Nueva factura</h2>
            <p class="modal-sub">Asocia la factura a una importación</p>
            <div class="form-grid">
                <div class="form-group full">
                    <label>Importación</label>
                    <select id="importacion_id">
                        <option value="">Selecciona importación</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>N° Factura</label>
                    <input type="text" id="numero_factura" placeholder="Ej: FAC-001">
                </div>
                <div class="form-group">
                    <label>Proveedor factura</label>
                    <input type="text" id="proveedor_factura" placeholder="Nombre del proveedor">
                </div>
                <div class="form-group">
                    <label>Monto</label>
                    <input type="number" id="monto" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Moneda</label>
                    <select id="moneda">
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="CLP">CLP</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fecha factura</label>
                    <input type="date" id="fecha_factura">
                </div>
                <div class="form-group full">
                    <label>Descripción</label>
                    <textarea id="descripcion" placeholder="Descripción de la factura..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-primary" onclick="guardar()">Guardar factura</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://importaciones-production-bf4d.up.railway.app';
        let todasFacturas = [];
        let importaciones = [];

        async function cargarImportaciones() {
            try {
                const res = await fetch(`${API}/importaciones`);
                importaciones = await res.json();
                const select = document.getElementById('importacion_id');
                const filtro = document.getElementById('filtro-importacion');
                importaciones.forEach(i => {
                    const label = `${i.proveedor_nombre} — ${i.producto || 'Sin producto'} — ${i.numero_seguimiento || 'Sin tracking'}`;
                    const opt1 = document.createElement('option');
                    opt1.value = i.id; opt1.textContent = label;
                    select.appendChild(opt1);
                    const opt2 = document.createElement('option');
                    opt2.value = i.id; opt2.textContent = label;
                    filtro.appendChild(opt2);
                });
            } catch(e) {}
        }

        async function cargarFacturas() {
            try {
                todasFacturas = [];
                for (const i of importaciones) {
                    const res = await fetch(`${API}/importaciones/${i.id}/facturas`);
                    const facturas = await res.json();
                    facturas.forEach(f => { f.importacion_nombre = `${i.proveedor_nombre} — ${i.producto || ''}`; f.importacion_id = i.id; f.proveedor_nombre = i.proveedor_nombre; f.numero_seguimiento = i.numero_seguimiento; });
                    todasFacturas = todasFacturas.concat(facturas);
                }
                renderTabla(todasFacturas);
                document.getElementById('subtitulo').textContent = `${todasFacturas.length} facturas`;
            } catch(e) {
                document.getElementById('tabla-body').innerHTML = '<tr><td colspan="6" class="empty-state">Error al conectar con el servidor</td></tr>';
            }
        }

        function renderTabla(data) {
            const tbody = document.getElementById('tabla-body');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No hay facturas registradas</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(f => `
                <tr>
                    <td><div class="td-main">${f.numero_factura || '—'}</div></td>
                    <td><div class="td-sub">${f.importacion_nombre || '—'}</div></td>
                    <td>${f.proveedor_nombre || '—'}</td>
                    <td>${f.numero_seguimiento || '—'}</td>
                    <td>${f.proveedor_factura || '—'}</td>
                    <td>${formatFecha(f.fecha_factura)}</td>
                    <td>${f.monto ? Number(f.monto).toLocaleString() + ' ' + f.moneda : '—'}</td>
                    <td>${f.descripcion || '—'}</td>
                </tr>
            `).join('');
        }

        function filtrar(texto) {
            const filtradas = todasFacturas.filter(f =>
                (f.numero_factura || '').toLowerCase().includes(texto.toLowerCase()) ||
                (f.proveedor_factura || '').toLowerCase().includes(texto.toLowerCase())
            );
            renderTabla(filtradas);
        }

        function filtrarPorImportacion() {
            const id = document.getElementById('filtro-importacion').value;
            if (!id) { renderTabla(todasFacturas); return; }
            renderTabla(todasFacturas.filter(f => f.importacion_id == id));
        }

        function formatFecha(fecha) {
            if (!fecha) return '—';
            return new Date(fecha).toLocaleDateString('es-CL');
        }

        function abrirModal() { document.getElementById('modal').classList.add('open'); }
        function cerrarModal() { document.getElementById('modal').classList.remove('open'); }

        async function guardar() {
            const importacion_id = document.getElementById('importacion_id').value;
            if (!importacion_id) { alert('Selecciona una importación'); return; }
            const data = {
                numero_factura: document.getElementById('numero_factura').value,
                proveedor_factura: document.getElementById('proveedor_factura').value,
                monto: document.getElementById('monto').value,
                moneda: document.getElementById('moneda').value,
                fecha_factura: document.getElementById('fecha_factura').value,
                descripcion: document.getElementById('descripcion').value,
            };
            try {
                const res = await fetch(`${API}/importaciones/${importacion_id}/facturas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) { cerrarModal(); await cargarFacturas(); }
                else { alert('Error al guardar'); }
            } catch(e) { alert('Error al conectar con el servidor'); }
        }

        async function init() {
            await cargarImportaciones();
            await cargarFacturas();
        }
        init();
    </script>
</body>
</html>
