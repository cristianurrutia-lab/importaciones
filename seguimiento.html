<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importaciones — Seguimiento</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: #f5f4f0; display: flex; flex-direction: column; height: 100vh; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #fff; border-bottom: 1px solid #ebebeb; flex-shrink: 0; }
        .topbar-title { font-size: 14px; font-weight: 600; color: #1a1a1a; }
        .topbar-user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #888; }
        .avatar { width: 30px; height: 30px; border-radius: 50%; background: #f0f0f0; border: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: center; }
        .layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 200px; background: #fff; border-right: 1px solid #ebebeb; padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; font-size: 13px; color: #666; cursor: pointer; text-decoration: none; transition: background 0.15s; }
        .nav-item:hover { background: #f5f4f0; color: #1a1a1a; }
        .nav-item.active { background: #f0efeb; color: #1a1a1a; font-weight: 500; }
        .nav-item i { font-size: 16px; }
        .main { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .page-header h1 { font-size: 18px; font-weight: 600; color: #1a1a1a; }
        .page-header p { font-size: 13px; color: #888; margin-top: 2px; }
        .table-card { background: #fff; border-radius: 14px; border: 1px solid #ebebeb; overflow: hidden; }
        .table-toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid #f0f0f0; }
        .search-input { flex: 1; padding: 8px 12px; border: 1px solid #e8e8e8; border-radius: 8px; font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; background: #fafafa; }
        .search-input:focus { border-color: #1a1a1a; background: #fff; }
        table { width: 100%; border-collapse: collapse; }
        thead th { padding: 10px 18px; text-align: left; font-size: 11px; font-weight: 500; color: #999; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #f0f0f0; }
        tbody tr { border-bottom: 1px solid #f8f8f8; transition: background 0.1s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #fafafa; }
        tbody td { padding: 12px 18px; font-size: 13px; color: #333; }
        .td-main { font-weight: 500; color: #1a1a1a; }
        .td-sub { font-size: 11px; color: #999; margin-top: 1px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; }
        .badge-blue { background: #e8f4fd; color: #185FA5; }
        .badge-yellow { background: #fdf6e8; color: #854F0B; }
        .badge-green { background: #e8fdf0; color: #0F6E56; }
        .badge-red { background: #fde8e8; color: #993C1D; }
        .badge-gray { background: #f0f0f0; color: #666; }
        .btn-sm { padding: 5px 10px; background: #1a1a1a; color: #fff; border: none; border-radius: 7px; font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
        .btn-sm:hover { background: #333; }
        .empty-state { text-align: center; padding: 48px; color: #aaa; font-size: 14px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 440px; box-shadow: 0 8px 40px rgba(0,0,0,0.12); }
        .modal h2 { font-size: 17px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
        .modal-sub { font-size: 13px; color: #888; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
        .form-group label { font-size: 12px; font-weight: 500; color: #555; }
        .form-group select, .form-group input { padding: 9px 12px; border: 1px solid #e8e8e8; border-radius: 8px; font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; background: #fafafa; color: #1a1a1a; }
        .form-group select:focus, .form-group input:focus { border-color: #1a1a1a; background: #fff; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-primary { display: flex; align-items: center; gap: 6px; padding: 9px 16px; background: #1a1a1a; color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; }
        .btn-primary:hover { background: #333; }
        .btn-secondary { padding: 9px 16px; background: #fff; color: #333; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
        .btn-secondary:hover { background: #f5f4f0; }
    </style>
</head>
<body>
    <div class="topbar">
        <span class="topbar-title">Sistema de Importaciones</span>
        <div class="topbar-user">
            <span>Usuario 2 — Seguimiento</span>
            <div class="avatar"><i class="ti ti-user" style="font-size:14px;color:#888;"></i></div>
        </div>
    </div>
    <div class="layout">
        <div class="sidebar">
            <a class="nav-item" href="pedidos.html"><i class="ti ti-package"></i> Importaciones</a>
            <a class="nav-item active" href="seguimiento.html"><i class="ti ti-truck"></i> Seguimiento</a>
            <a class="nav-item" href="facturas.html"><i class="ti ti-file-invoice"></i> Facturas</a>
            <a class="nav-item" href="pagos.html"><i class="ti ti-credit-card"></i> Pagos</a>
            <a class="nav-item" href="proveedores.html">
                a class="nav-item" href="analisis.html"><i class="ti ti-chart-bar"></i> Análisis</a
                <i class="ti ti-building"></i> Proveedores</a>
        </div>
        <div class="main">
            <div class="page-header">
                <h1>Seguimiento</h1>
                <p id="subtitulo">Cargando...</p>
            </div>
            <div class="table-card">
                <div class="table-toolbar">
                    <input class="search-input" type="text" placeholder="Buscar importación..." oninput="filtrar(this.value)">
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Proveedor / Producto</th>
                            <th>N° Seguimiento</th>
                            <th>Forwarder</th>
                            <th>Llegada estimada</th>
                            <th>Estado</th>
                            <th>CDA</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                        <tr><td colspan="7" class="empty-state">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL CDA -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2>Actualizar CDA</h2>
            <p class="modal-sub" id="modal-nombre">—</p>
            <div class="form-group">
                <label>Estado CDA</label>
                <select id="estado_cda">
                    <option value="pendiente">Pendiente</option>
                    <option value="en_proceso">En proceso</option>
                    <option value="aprobado">Aprobado</option>
                    <option value="rechazado">Rechazado</option>
                </select>
            </div>
            <div class="form-group">
                <label>Fecha CDA</label>
                <input type="date" id="fecha_cda">
            </div>
            <div class="form-group">
                <label>Estado importación</label>
                <select id="estado">
                    <option value="en_transito">En tránsito</option>
                    <option value="en_aduana">En aduana</option>
                    <option value="recibido">Recibido</option>
                    <option value="cancelado">Cancelado</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-primary" onclick="guardar()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://importaciones-production-bf4d.up.railway.app';
        let importaciones = [];
        let importacionSeleccionada = null;

        const estadoBadge = {
            'en_transito': '<span class="badge badge-blue">En tránsito</span>',
            'en_aduana':   '<span class="badge badge-yellow">En aduana</span>',
            'recibido':    '<span class="badge badge-green">Recibido</span>',
            'cancelado':   '<span class="badge badge-red">Cancelado</span>',
        };
        const cdaBadge = {
            'pendiente':  '<span class="badge badge-gray">Pendiente</span>',
            'en_proceso': '<span class="badge badge-yellow">En proceso</span>',
            'aprobado':   '<span class="badge badge-green">Aprobado</span>',
            'rechazado':  '<span class="badge badge-red">Rechazado</span>',
        };

        async function cargar() {
            try {
                const res = await fetch(`${API}/importaciones`);
                importaciones = await res.json();
                renderTabla(importaciones);
                document.getElementById('subtitulo').textContent = `${importaciones.length} importaciones`;
            } catch(e) {
                document.getElementById('tabla-body').innerHTML = '<tr><td colspan="7" class="empty-state">Error al conectar con el servidor</td></tr>';
            }
        }

        function renderTabla(data) {
            const tbody = document.getElementById('tabla-body');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No hay importaciones registradas</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(i => `
                <tr>
                    <td>
                        <div class="td-main">${i.proveedor_nombre}</div>
                        <div class="td-sub">${i.producto || '—'}</div>
                    </td>
                    <td>${i.numero_seguimiento || '—'}</td>
                    <td>${i.forwarder || '—'}</td>
                    <td>${formatFecha(i.fecha_estimada_llegada)}</td>
                    <td>${estadoBadge[i.estado] || i.estado}</td>
                    <td>${cdaBadge[i.estado_cda] || i.estado_cda}</td>
                    <td><button class="btn-sm" onclick="abrirModal(${i.id})">Actualizar</button></td>
                </tr>
            `).join('');
        }

        function filtrar(texto) {
            const filtradas = importaciones.filter(i =>
                (i.proveedor_nombre || '').toLowerCase().includes(texto.toLowerCase()) ||
                (i.producto || '').toLowerCase().includes(texto.toLowerCase())
            );
            renderTabla(filtradas);
        }

        function formatFecha(fecha) {
            if (!fecha) return '—';
            return new Date(fecha).toLocaleDateString('es-CL');
        }

        function abrirModal(id) {
            importacionSeleccionada = importaciones.find(i => i.id === id);
            if (!importacionSeleccionada) return;
            document.getElementById('modal-nombre').textContent = `${importacionSeleccionada.proveedor_nombre} — ${importacionSeleccionada.producto || ''}`;
            document.getElementById('estado_cda').value = importacionSeleccionada.estado_cda || 'pendiente';
            document.getElementById('estado').value = importacionSeleccionada.estado || 'en_transito';
            document.getElementById('fecha_cda').value = importacionSeleccionada.fecha_cda ? importacionSeleccionada.fecha_cda.split('T')[0] : '';
            document.getElementById('modal').classList.add('open');
        }

        function cerrarModal() { document.getElementById('modal').classList.remove('open'); }

        async function guardar() {
            const data = {
                estado_cda: document.getElementById('estado_cda').value,
                fecha_cda: document.getElementById('fecha_cda').value,
                estado: document.getElementById('estado').value,
            };
            try {
                const res = await fetch(`${API}/importaciones/${importacionSeleccionada.id}/cda`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) { cerrarModal(); cargar(); }
                else { alert('Error al guardar'); }
            } catch(e) { alert('Error al conectar con el servidor'); }
        }

        cargar();
    </script>
</body>
</html>
